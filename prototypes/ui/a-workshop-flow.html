<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BenchUp prototype A · Workshop flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="shared/theme.js"></script>
<link rel="stylesheet" href="shared/workshop.css" />
<style>
  /* The #cutlist hash makes the browser focus the panel; it is not an interactive control. */
  .cutlist:focus { outline: none; }
  .cut-bar { display: flex; align-items: center; gap: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
  .cut-facts { display: flex; gap: 16px; color: var(--muted); font-size: 12.5px; flex: 1; }
  .cut-facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cut-facts span, .switch, .cut-link { white-space: nowrap; }
  @media (max-width: 1440px) { .cut-facts > span:nth-child(3) { display: none; } .cut-bar { gap: 14px; } }
  .cut-link { color: var(--accent); font-size: 12.5px; text-decoration: none; }
  .cut-link:hover { text-decoration: underline; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
  .switch input { position: absolute; opacity: 0; }
  .switch span { width: 30px; height: 18px; border-radius: 9px; background: var(--line-strong); position: relative; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(12px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .otag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; margin-left: 4px; }
  .otag.mine { background: var(--ok-bg); color: var(--ok-ink); }
  .otag.buy { background: var(--warn-bg); color: var(--warn-ink); }
  td .otag { margin-left: 0; }
  .cut-h { margin: 24px 2px 10px; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
  .cut-h span { color: var(--muted); font-weight: 400; font-size: 12.5px; }
  .cutlist .boards { margin-top: 0; }
  .cut-note { color: var(--muted); font-size: 12px; margin: 14px 2px 30px; }
  .bh-r { display: inline-flex; align-items: center; gap: 12px; }
  .confirmed { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ok-ink); }
  .ask { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .ask button { height: 24px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--panel); font-size: 12px; color: var(--ink); }
  .ask button:hover { background: var(--hover); }
  .maybe-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--warn-bg); border-radius: var(--radius); padding: 8px 12px 8px 8px; margin-bottom: 12px; line-height: 1.45; }
  .maybe-row .mini, .mrow .mini { width: 64px; height: 34px; border-radius: 6px; background: var(--panel); display: grid; place-items: center; }
  .modal-back { position: fixed; inset: 0; background: rgba(20,18,14,.38); display: grid; place-items: center; z-index: 30; animation: fade .15s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .modal { width: 520px; max-height: 86vh; display: flex; flex-direction: column; background: var(--panel); border-radius: 14px; box-shadow: var(--pop-shadow); border: 1px solid var(--line); }
  .modal-body { padding: 20px 22px 8px; overflow: auto; }
  .modal h2 { margin: 0 0 4px; font-size: 17px; }
  .modal .lead { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
  .modal h4 { margin: 14px 0 6px; font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; display: flex; justify-content: space-between; }
  .modal h4 span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
  .mrow { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .mrow.pickable { grid-template-columns: 18px 64px 1fr; cursor: pointer; }
  .mrow input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .mrow .mini { background: var(--bg); }
  .mrow small { display: block; color: var(--muted); font-size: 11.5px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; border-top: 1px solid var(--line); margin-top: 8px; }
  .srow2 { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; }
  .srow2 .mini { width: 56px; height: 30px; border-radius: 6px; background: var(--bg); display: grid; place-items: center; }
  .srow2 small { display: block; color: var(--muted); font-size: 11.5px; }
  .srow2 b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .stat.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
  .stat.total span, .stat.total b { color: var(--ink); font-weight: 600; }
  aside.right .note { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .cut-toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-size: 13px; transition: opacity .18s, transform .18s; pointer-events: none; z-index: 20; max-width: 560px; }
  .cut-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .seg .mode-link { height: 28px; padding: 0 10px; border-radius: 6px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-size: 12px; text-decoration: none; }
  .seg .mode-link:hover { color: var(--ink); }
  .card-link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 12px; text-decoration: none; margin-top: 10px; }
  .card-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <a class="mark" href="a-start.html" title="All projects" style="text-decoration:none">B</a>
      <div class="project"><b>Hall bench</b><span>Saved · 12 parts · 3 materials</span></div>
      <button class="iconbtn" title="Undo"><i data-icon="undo"></i></button>
      <button class="iconbtn" title="Redo"><i data-icon="redo"></i></button>
    </div>
    <nav class="stages" id="stages">
      <button class="stage done" data-stage="design"><span class="n">1</span>Design</button>
      <button class="stage" data-stage="joinery"><span class="n">2</span>Joinery</button>
      <button class="stage" data-stage="shaping"><span class="n">3</span>Shaping</button>
      <button class="stage" data-stage="cutlist"><span class="n">4</span>Cut list</button>
      <button class="stage" data-stage="estimate"><span class="n">5</span>Estimate</button>
      <button class="stage" data-stage="planning"><span class="n">6</span>Planning</button>
    </nav>
    <script src="shared/stages.js"></script>
    <div class="hdr-actions">
      <button class="iconbtn" title="Search commands"><i data-icon="search"></i></button>
      <button class="iconbtn" data-theme-toggle title="Dark mode"></button>
      <button class="btn"><i data-icon="share" data-size="16"></i>Share</button>
    </div>
  </header>

  <div class="body">
    <aside class="left">
      <div class="aside-head"><h2>Parts<span class="count">12</span></h2><button class="iconbtn" title="Add part"><i data-icon="plus" data-size="16"></i></button></div>
      <div class="search"><i data-icon="search" data-size="15"></i><input placeholder="Find a part" /></div>
      <div class="parts" id="parts"></div>
      <div class="stockbar">
        <div class="lbl">Add from stock</div>
        <div class="chips">
          <button class="chip"><i data-icon="plus" data-size="13"></i>Square 45 × 45</button>
          <button class="chip"><i data-icon="plus" data-size="13"></i>Board 90 × 20</button>
          <button class="chip"><i data-icon="plus" data-size="13"></i>Sheet 18 mm</button>
          <button class="chip"><i data-icon="plus" data-size="13"></i>Dowel Ø10</button>
        </div>
      </div>
    </aside>

    <main id="main">
      <svg class="vp" id="vp"></svg>
      <div class="overlay" style="left:16px;top:16px">
        <div class="seg" title="Design mode"><button class="on">Shape</button><a class="mode-link" href="a-materials.html"><i data-icon="paint" data-size="15"></i>Materials</a></div>
        <div class="seg" id="views">
          <button class="on" data-v="persp"><i data-icon="cube" data-size="15"></i>3D</button>
          <button data-v="front">Front</button>
          <button data-v="side">Side</button>
          <button data-v="top">Top</button>
        </div>
      </div>
      <div class="overlay" style="right:16px;top:16px">
        <div class="seg">
          <button class="on">Wood</button>
          <button>Grain</button>
          <button>X-ray</button>
        </div>
      </div>
      <div class="toolstrip" id="toolstrip">
        <div class="hint" id="hint"></div>
        <div class="tools" id="tools"></div>
      </div>
      <div class="cutlist" id="cutlist"></div>
    </main>

    <aside class="right" id="right"></aside>
  </div>
</div>

<script src="shared/icons.js"></script>
<script src="shared/model.js"></script>
<script src="shared/stock-data.js"></script>
<script>
  const { PARTS, MATERIALS, size, fmtDims, mm, BenchView } = BenchModel;
  const COLORS = { oak: "#cfa771", walnut: "#7b5338", plywood: "#e6d3a8" };
  const GROUPS = ["Panels", "Legs", "Aprons", "Stretchers"];

  const touching = (A, B) => [0, 1, 2].every((k) => A.min[k] <= B.max[k] + 1e-6 && B.min[k] <= A.max[k] + 1e-6);
  function jointType(a, b) {
    const kinds = [a.kind, b.kind].sort().join("+");
    if (kinds === "Aprons+Legs" || kinds === "Legs+Stretchers") return { name: "Mortise & tenon", icon: "tenon", spec: "Tenon 30 × 10, depth 25" };
    if (kinds === "Aprons+Panels") return { name: "Tabletop fastener", icon: "screw", spec: "Figure-8, every 250" };
    if (kinds === "Panels+Stretchers") return { name: "Groove", icon: "groove", spec: "18 wide, 8 deep" };
    return { name: "Butt", icon: "joint", spec: "Glue only" };
  }
  const JOINT_FIELDS = {
    tenon: [["Length", 30], ["Thickness", 10], ["Depth", 25]],
    screw: [["Spacing", 250], ["Count", 6], ["Inset", 10]],
    groove: [["Width", 18], ["Depth", 8], ["Offset", 12]],
  };
  const neighbours = (p) => PARTS.filter((q) => q !== p && touching(p, q));

  const STAGES = {
    design: {
      tools: [["select", "Select"], ["board", "Board"], ["panel", "Panel"], ["draw", "Sketch"], "|", ["pushpull", "Extrude"], ["move", "Move"], ["rotate", "Rotate"], ["mirror", "Mirror"], ["array", "Repeat"], "|", ["measure", "Measure"], ["section", "Section"]],
      hint: 'Board: click two corners, drag the thickness, or type <kbd>450</kbd><kbd>Tab</kbd><kbd>90</kbd>',
    },
    joinery: {
      tools: [["select", "Select"], "|", ["tenon", "Mortise"], ["dowel", "Dowels"], ["dovetail", "Dovetail"], ["halflap", "Half-lap"], ["finger", "Finger"], ["groove", "Groove"], ["screw", "Screws"]],
      hint: "Pick two touching parts to join them · Connected parts are highlighted",
    },
    cutlist: { tools: [], hint: "" },
  };

  let stage = "design";
  let tool = "select";
  let selected = "apron-f";

  const view = new BenchView(document.getElementById("vp"), {
    theme: {
      colors: COLORS,
      stroke: "rgba(60,45,30,0.45)",
      strokeWidth: 0.7,
      selectedStroke: "#d63b32",
      selectedWidth: 2,
      hoverStroke: "rgba(214,59,50,.6)",
      dimColor: "#d63b32",
      dimText: "#b8302a",
      grid: { minor: "rgba(40,40,40,.06)", major: "rgba(40,40,40,.12)" },
      shadow: "rgba(60,50,40,.22)",
    },
    selectedId: selected,
    view: { azimuth: 62, elevation: 24, pan: [0, -30] },
    onSelect: (id) => select(id, false),
  });
  benchTheme.bind(view);
  // The cut list draws SVG with the accent colour, so redraw it too.
  window.addEventListener("themechange", () => { if (stage === "cutlist") renderCutlist(); });

  function select(id, updateView = true) {
    selected = id;
    if (updateView) view.setSelected(id);
    applyStageTheme();
    renderParts();
    renderRight();
    if (stage === "cutlist") renderCutlist();
  }

  function applyStageTheme() {
    const p = PARTS.find((q) => q.id === selected);
    view.theme.dimmed = stage === "joinery" && p ? new Set([p.id, ...neighbours(p).map((q) => q.id)]) : null;
    view.dims = stage === "design";
    view.render();
  }

  function renderParts() {
    const host = document.getElementById("parts");
    host.innerHTML = GROUPS.map((g) => {
      const items = PARTS.filter((p) => p.kind === g);
      return `<div class="group-h">${g}<span class="count">${items.length}</span></div>` +
        items.map((p) => `<div class="row ${p.id === selected ? "sel" : ""}" data-id="${p.id}">
          <span class="sw" style="background:${COLORS[p.material]}"></span>
          <span class="nm">${p.name}</span><span class="dm">${fmtDims(p)}</span></div>`).join("");
    }).join("");
    host.querySelectorAll(".row").forEach((r) => (r.onclick = () => select(r.dataset.id)));
  }

  function renderTools() {
    const s = STAGES[stage];
    document.getElementById("toolstrip").style.display = s.tools.length ? "" : "none";
    document.getElementById("hint").innerHTML = s.hint;
    document.getElementById("tools").innerHTML = s.tools.map((t) => t === "|" ? '<span class="tool-sep"></span>' :
      `<button class="tool ${t[0] === tool ? "on" : ""}" data-tool="${t[0]}">${icon(t[0], 20)}<span>${t[1]}</span></button>`).join("");
    document.querySelectorAll(".tool").forEach((b) => (b.onclick = () => { tool = b.dataset.tool; renderTools(); }));
  }

  function partCard(p) {
    const s = size(p);
    const twins = PARTS.filter((q) => q.name === p.name).length;
    const joints = neighbours(p).map((q) => ({ q, j: jointType(p, q) }));
    return `
      <div class="card">
        <input class="title-input" value="${p.name}" />
        <div class="sub"><span class="tag">${p.kind}</span>${twins > 1 ? `<span>${twins} identical parts</span>` : ""}</div>
      </div>
      <div class="card">
        <h3>Size<span style="text-transform:none;letter-spacing:0;font-weight:500">mm</span></h3>
        <div class="dims">
          <div class="dim"><label>Length</label><div><input value="${mm(s.length)}" /></div></div>
          <div class="dim"><label>Width</label><div><input value="${mm(s.width)}" /></div></div>
          <div class="dim"><label>Thickness</label><div><input value="${mm(s.thickness)}" /></div></div>
        </div>
        <div class="field"><label>Material</label>
          <div class="select"><span class="sw" style="background:${COLORS[p.material]}"></span><span class="grow">${MATERIALS[p.material].name}</span>${icon("chevronDown", 14)}</div></div>
        <div class="field"><label>Grain</label>
          <div class="segs"><button class="on">Along length</button><button>Across</button></div></div>
        <div class="field"><label>Stock</label><div style="color:var(--muted)">${MATERIALS[p.material].stock}</div></div>
        <div class="field"><label>Finish</label><div class="select"><span class="grow">${p.material === "plywood" ? "Water-based lacquer" : "Hardwax oil, matte"}</span>${icon("chevronDown", 14)}</div></div>
        <a class="card-link" href="a-materials.html">${icon("paint", 14)}Paint materials onto several parts</a>
      </div>
      <div class="card">
        <h3>Joints<span>${joints.length}</span></h3>
        ${joints.map(({ q, j }) => `<div class="joint"><span class="jic">${icon(j.icon, 16)}</span>
          <div>${j.name}<small>to ${q.name.toLowerCase()} · ${j.spec}</small></div>${icon("chevronRight", 14)}</div>`).join("")}
      </div>
      <div class="actions"><button class="btn">${icon("copy", 15)}Duplicate</button><button class="btn">${icon("hide", 15)}Hide</button></div>`;
  }

  function renderRight() {
    const host = document.getElementById("right");
    const p = PARTS.find((q) => q.id === selected);
    if (stage === "cutlist") {
      const S = BenchStock;
      const stock = S.loadStock();
      const plan = S.cutPlan(S.itemsFromParts(PARTS, size), stock);
      const mini = (L, W, T, sp) => `<span class="mini">${S.boardArt(L, W, T, sp, 54, 28)}</span>`;
      const buy = plan.buyList.map((g) => `<div class="srow2">${mini(g.catalog.L, g.catalog.W, g.catalog.T, g.catalog.species)}<span>${g.qty} × ${g.catalog.name}<small>${S.fmtSize(g.catalog)} mm</small></span><b>€${g.qty * g.catalog.price}</b></div>`).join("");
      const mine = plan.fromStock.map((x) => `<div class="srow2">${mini(x.L, x.W, x.T, x.species)}<span>${S.SPECIES[x.species].name} ${x.L} × ${x.W}<small>${x.kind === "offcut" ? "Offcut from " + x.offcut.from : "From your shop"}</small></span><b></b></div>`).join("");
      const stockCost = stock.costing === "free" ? 0 : plan.stockValue;
      host.innerHTML = `<div class="card"><h3>To buy</h3>${buy || '<p class="note" style="margin:0">You have all the wood you need.</p>'}
          <div class="stat total"><span>Total</span><b>€${plan.buyCost}</b></div></div>
        <div class="card"><h3>From your shop</h3>${mine || '<p class="note" style="margin:0">' + (stock.useStock ? "Nothing in your shop fits these parts." : "Using your own wood is switched off.") + "</p>"}
          <a class="btn" href="a-workshop.html?from=cutlist#stock" style="margin-top:10px;width:100%;justify-content:center;text-decoration:none;color:inherit">${icon("stock", 15)}Manage wood stock</a></div>
        <div class="card"><h3>Summary</h3>
        <div class="stat"><span>Waste</span><b>${plan.waste} %</b></div>
        <div class="stat"><span>Offcuts to keep</span><b>${plan.leftovers}</b></div>
        <div class="stat"><span>Material cost</span><b>€ ${plan.buyCost + stockCost}</b></div>
        <p class="note" style="margin:6px 0 0">${stock.costing === "free" ? "Wood from your shop counts at no cost." : `Includes €${plan.stockValue} for wood you already have, at purchase price.`}</p></div>
        <div class="actions sticky" style="flex-wrap:wrap"><button class="btn">${icon("download", 15)}Export PDF</button><button class="btn">${icon("print", 15)}Labels</button>
          <button class="btn primary" id="built" style="flex-basis:100%">${icon("check", 15)}Mark as built</button></div>`;
      host.querySelector("#built").onclick = () => openBuilt();
      return;
    }
    if (!p) {
      host.innerHTML = `<div class="empty" style="padding-bottom:12px"><b>Nothing selected.</b><br>Click a part in the model or in the list to edit its size, material and joints.</div>
        <div class="card"><h3>Materials in this project</h3>
        ${Object.entries(MATERIALS).map(([k, m]) => `<div class="mat">
          <span class="big" style="background-color:${COLORS[k]}"></span>
          <div>${m.name}<small>${m.stock}</small></div><small>${PARTS.filter((q) => q.material === k).length} parts</small></div>`).join("")}
        <a class="btn" href="a-materials.html" style="margin-top:10px;width:100%;justify-content:center;text-decoration:none;color:inherit">${icon("paint", 15)}Assign materials</a></div>
        <div class="card"><h3>Finish</h3>
          <div class="field" style="margin-top:0"><label>Product</label><div class="select"><span class="grow">Hardwax oil, matte</span>${icon("chevronDown", 14)}</div></div>
          <div class="field"><label>Coats</label><div class="segs"><button>1</button><button class="on">2</button><button>3</button></div></div>
          <div class="field"><label>Sanding</label><div style="color:var(--muted)">120 → 180 → 240</div></div></div>`;
      return;
    }
    if (stage === "joinery") {
      const joints = neighbours(p).map((q) => ({ q, j: jointType(p, q) }));
      host.innerHTML = `<div class="card"><input class="title-input" value="${p.name}" /><div class="sub"><span class="tag">${p.kind}</span><span>${joints.length} joints</span></div></div>` +
        joints.map(({ q, j }, i) => `<div class="card"><h3>${j.name}<span>${q.name}</span></h3>
          <div class="dims">${(JOINT_FIELDS[j.icon] || JOINT_FIELDS.tenon).map(([l, v]) => `<div class="dim"><label>${l}</label><div><input value="${v}" /></div></div>`).join("")}</div>
          <div class="field"><label>Clearance</label><div class="segs"><button>Tight</button><button class="on">0.2 mm</button><button>Loose</button></div></div></div>`).join("");
      return;
    }
    host.innerHTML = partCard(p);
  }

  function pack() {
    // Shelf packing of the solid-wood parts onto 2400 × 140 boards (illustrative).
    const items = PARTS.filter((p) => p.material !== "plywood").map((p) => ({ p, l: size(p).length * 10, w: size(p).width * 10 }))
      .sort((a, b) => b.l - a.l);
    const boards = [];
    for (const it of items) {
      const mat = it.p.material;
      let placed = false;
      for (const b of boards) {
        if (b.mat !== mat) continue;
        for (const shelf of b.shelves) {
          if (shelf.x + it.l <= b.L && it.w <= shelf.h) { b.items.push({ ...it, x: shelf.x, y: shelf.y }); shelf.x += it.l + 5; placed = true; break; }
        }
        if (placed) break;
        const used = b.shelves.reduce((a, s) => a + s.h + 5, 0);
        if (used + it.w <= b.W) { b.shelves.push({ x: it.l + 5, y: used, h: it.w }); b.items.push({ ...it, x: 0, y: used }); placed = true; break; }
      }
      if (!placed) {
        const L = mat === "walnut" ? 1200 : 2400; const W = mat === "walnut" ? 360 : 140;
        boards.push({ mat, L, W, shelves: [{ x: it.l + 5, y: 0, h: it.w }], items: [{ ...it, x: 0, y: 0 }] });
      }
    }
    return boards;
  }

  function cutToast(text) {
    let t = document.getElementById("cutToast");
    if (!t) { t = document.createElement("div"); t.id = "cutToast"; t.className = "cut-toast"; document.body.appendChild(t); }
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(cutToast.t);
    cutToast.t = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // "Mark as built": take used wood out of the stock and choose which leftovers to keep.
  function openBuilt() {
    const S = BenchStock;
    const stock = S.loadStock();
    const plan = S.cutPlan(S.itemsFromParts(PARTS, size), stock);
    const keep = plan.sources.flatMap((src) => src.leftovers.map((l, i) => ({ key: `${plan.sources.indexOf(src)}-${i}`, species: src.species, L: l.L, W: l.W, T: src.T, origin: src.kind === "buy" ? "from a board you'll buy" : src.kind === "offcut" ? "left from the " + src.offcut.from.toLowerCase() + " offcut" : "from a board in your shop" })));
    const row = (art, title, sub, extra = "") => `<div class="mrow">${extra}<span class="mini">${art}</span><span>${title}<small>${sub}</small></span></div>`;
    const used = plan.fromStock.map((x) => row(S.boardArt(x.L, x.W, x.T, x.species, 60, 32), `${S.SPECIES[x.species].name} ${x.L} × ${x.W} × ${x.T}`, x.kind === "offcut" ? "Offcut from " + x.offcut.from : "Board from your shop")).join("");
    const kept = keep.map((k) => `<label class="mrow pickable">${`<input type="checkbox" data-keep="${k.key}" checked />`}<span class="mini">${S.boardArt(k.L, k.W, k.T, k.species, 60, 32)}</span><span>${S.SPECIES[k.species].name} ${k.L} × ${k.W} × ${k.T}<small>${k.origin[0].toUpperCase() + k.origin.slice(1)}</small></span></label>`).join("");
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="builtTitle">
      <div class="modal-body"><h2 id="builtTitle">Mark Hall bench as built</h2>
        <p class="lead">BenchUp updates your wood stock with what this build used and what is left over. You can change it later in My workshop.</p>
        <h4>Taken out of your stock<span>${plan.fromStock.length}</span></h4>${used || '<p class="note">Nothing came from your stock.</p>'}
        <h4>Offcuts worth keeping<span>Untick the ones you won't keep</span></h4>${kept || '<p class="note">No piece is big enough to keep.</p>'}</div>
      <div class="modal-foot"><button class="btn primary" data-apply>Update stock</button><button class="btn" data-close>Cancel</button></div></div>`;
    document.body.appendChild(back);
    const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    back.addEventListener("click", (e) => {
      if (e.target === back || e.target.closest("[data-close]")) { close(); return; }
      if (!e.target.closest("[data-apply]")) return;
      const snap = JSON.parse(JSON.stringify(stock));
      plan.fromStock.forEach((src) => S.goneSource(stock, src));
      const chosen = [...back.querySelectorAll("[data-keep]:checked")].map((c) => keep.find((k) => k.key === c.dataset.keep));
      chosen.forEach((k, i) => stock.offcuts.push({ id: `hb${Date.now()}${i}`, species: k.species, L: k.L, W: k.W, T: k.T, from: "Hall bench", seen: new Date().toISOString() }));
      S.saveStock(stock);
      close();
      renderCutlist(); renderRight();
      S.undoToast(`Stock updated: ${plan.fromStock.length} piece${plan.fromStock.length === 1 ? "" : "s"} used, ${chosen.length} offcut${chosen.length === 1 ? "" : "s"} kept`, snap, () => { renderCutlist(); renderRight(); });
    });
    back.querySelector("[data-apply]").focus();
  }

  function renderCutlist() {
    const S = BenchStock;
    const host = document.getElementById("cutlist");
    const stock = S.loadStock();
    const plan = S.cutPlan(S.itemsFromParts(PARTS, size), stock);
    // Where each part comes from, for the table.
    const origin = {};
    for (const src of plan.sources) for (const it of src.items) (origin[it.id] = origin[it.id] || new Set()).add(src.kind === "offcut" ? "Offcut" : src.kind === "stock" ? "Your shop" : "Buy");
    const rows = [];
    for (const p of PARTS) {
      const key = p.name + p.material;
      const r = rows.find((x) => x.key === key);
      if (r) { r.qty++; r.ids.push(p.id); } else rows.push({ key, p, qty: 1, ids: [p.id] });
    }
    const originTag = (ids) => {
      const kinds = new Set(ids.flatMap((id) => [...(origin[id] || [])]));
      return [...kinds].map((k) => `<span class="otag ${k === "Buy" ? "buy" : "mine"}">${k}</span>`).join(" ");
    };
    const maxL = Math.max(...plan.sources.map((x) => x.L), 1200);
    const k = 1000 / maxL; // shared scale so boards compare honestly
    const board = (b) => {
      const col = S.SPECIES[b.species].color;
      const tag = b.kind === "buy" ? `<span class="otag buy">Buy · €${b.catalog.price}</span>` : `<span class="otag mine">${b.kind === "offcut" ? "Offcut · " + b.offcut.from : "In your shop"}</span>`;
      const key = b.kind === "offcut" ? "offcut:" + b.offcut.id : b.kind === "stock" ? "stock:" + b.catalog.id : "";
      const check = !key ? "" : S.sourceConfirmed(stock, b)
        ? `<span class="confirmed">${icon("check", 12)}Still in the shop</span>`
        : `<span class="ask"><span>Still have it?</span><button data-src-yes="${key}">Yes</button><button data-src-gone="${key}">No</button></span>`;
      const name = b.kind === "offcut" ? `${S.SPECIES[b.species].name} offcut` : b.catalog.name;
      return `<div class="board"><div class="bh"><span>${name} ${tag}</span><span class="bh-r">${check}<span>${b.L} × ${b.W} × ${b.T}</span></span></div>
        <svg viewBox="0 0 1000 ${b.W * k + 2}" style="max-height:${Math.max(24, b.W * k + 2)}px"><rect x="1" y="1" width="${b.L * k - 2}" height="${b.W * k}" rx="3" fill="${col}" opacity=".22" stroke="${col}"/>
        ${b.leftovers.map((l) => `<rect x="${1 + l.x * k}" y="${1 + l.y * k}" width="${l.L * k - 2}" height="${l.W * k}" fill="url(#keep)" style="stroke:var(--done-ink)" stroke-dasharray="4 3" stroke-width="1"/>
          ${l.W * k > 11 ? `<text x="${1 + l.x * k + 6}" y="${1 + l.y * k + Math.min(l.W * k, 14) - 3}" font-size="${Math.min(10, l.W * k - 2)}" style="fill:var(--done-ink)" font-family="system-ui">Keep ${l.L} × ${l.W}</text>` : ""}`).join("")}
        ${b.items.map((it) => `<rect x="${1 + it.x * k}" y="${1 + it.y * k}" width="${it.l * k}" height="${it.w * k}" fill="${col}" stroke="${it.id === selected ? benchTheme.accent() : "rgba(0,0,0,.35)"}" stroke-width="${it.id === selected ? 2 : 0.8}"/>
          ${it.w * k > 9 && it.l * k > 50 ? `<text x="${1 + it.x * k + 6}" y="${1 + it.y * k + Math.min(it.w * k, 14) - 3}" font-size="${Math.min(10, it.w * k - 2)}" fill="${b.species === "walnut" ? "#f6ead8" : "#2a1f14"}" font-family="system-ui">${it.name} ${Math.round(it.l)}</text>` : ""}`).join("")}
        </svg></div>`;
    };
    host.innerHTML = `<svg width="0" height="0" style="position:absolute"><defs><pattern id="keep" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--done-ink)" stroke-width="1" opacity=".35"/></pattern></defs></svg>
      <h2>Cut list</h2><p class="lead">Finished sizes in millimetres. Lengths include tenons; grain runs along the length.</p>
      <div class="cut-bar">
        <label class="switch"><input type="checkbox" id="useStock" ${stock.useStock ? "checked" : ""}/><span></span>Use wood from my shop first</label>
        <div class="cut-facts"><span><b>${plan.fromStock.length}</b> from your shop</span><span><b>${plan.toBuy.length}</b> to buy · <b>€${plan.buyCost}</b></span><span>Waste <b>${plan.waste} %</b></span></div>
        <a class="cut-link" href="a-workshop.html?from=cutlist#stock">Manage wood stock</a>
      </div>
      <table><thead><tr><th>Part</th><th class="num">Qty</th><th class="num">Length</th><th class="num">Width</th><th class="num">Thick.</th><th>Material</th><th>From</th></tr></thead><tbody>
      ${rows.map((r) => { const s = size(r.p); return `<tr data-id="${r.ids[0]}" ${r.ids.includes(selected) ? 'style="background:var(--accent-soft)"' : ""}>
        <td><span style="display:inline-flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:3px;background:${COLORS[r.p.material]}"></span>${r.p.name}</span></td>
        <td class="num">${r.qty}</td><td class="num">${mm(s.length)}</td><td class="num">${mm(s.width)}</td><td class="num">${mm(s.thickness)}</td><td>${MATERIALS[r.p.material].name}</td><td>${originTag(r.ids)}</td></tr>`; }).join("")}
      </tbody></table>
      ${plan.fromStock.length ? `<h3 class="cut-h">From your shop<span>${plan.fromStock.length} piece${plan.fromStock.length > 1 ? "s" : ""} you already have</span></h3><div class="boards">${plan.fromStock.map(board).join("")}</div>` : ""}
      ${plan.toBuy.length ? `<h3 class="cut-h">To buy<span>${plan.toBuy.length} board${plan.toBuy.length > 1 ? "s" : ""} · €${plan.buyCost}</span></h3>
        ${plan.maybe.map((o) => `<div class="maybe-row"><span class="mini">${S.boardArt(o.L, o.W, o.T, o.species, 60, 32)}</span><span>You may still have a <b>${S.SPECIES[o.species].name.toLowerCase()} offcut ${o.L} × ${o.W}</b> from ${o.from}. It hasn't been confirmed for ${Math.round(S.daysSince(o.seen) / 30)} months, so this cut list doesn't count on it.</span><span class="ask"><span>Still have it?</span><button data-off-yes="${o.id}">Yes</button><button data-off-gone="${o.id}">No</button></span></div>`).join("")}
        <div class="boards">${plan.toBuy.map(board).join("")}</div>` : ""}
      <p class="cut-note">Hatched areas are offcuts worth keeping. When you mark the project as built, BenchUp offers to add them to your stock.</p>`;
    host.querySelectorAll("tbody tr").forEach((r) => (r.onclick = () => select(r.dataset.id)));
    host.querySelector("#useStock").onchange = (e) => { stock.useStock = e.target.checked; S.saveStock(stock); renderCutlist(); renderRight(); };
    const refresh = () => { renderCutlist(); renderRight(); };
    const srcOf = (key) => plan.sources.find((x) => (x.kind === "offcut" ? "offcut:" + x.offcut.id : x.kind === "stock" ? "stock:" + (x.catalog && x.catalog.id) : "") === key);
    host.onclick = (e) => {
      const t = e.target;
      const yes = t.closest("[data-src-yes]");
      if (yes) { S.confirmSource(stock, srcOf(yes.dataset.srcYes)); S.saveStock(stock); refresh(); return; }
      const gone = t.closest("[data-src-gone]");
      if (gone) {
        const snap = JSON.parse(JSON.stringify(stock));
        S.goneSource(stock, srcOf(gone.dataset.srcGone)); S.saveStock(stock); refresh();
        S.undoToast("Taken out of your stock. The cut list now buys that wood instead.", snap, refresh);
        return;
      }
      const oy = t.closest("[data-off-yes]");
      if (oy) { const o = stock.offcuts.find((x) => x.id === oy.dataset.offYes); if (o) o.seen = new Date().toISOString(); S.saveStock(stock); refresh(); cutToast("Confirmed. The cut list uses it now."); return; }
      const og = t.closest("[data-off-gone]");
      if (og) { const snap = JSON.parse(JSON.stringify(stock)); stock.offcuts = stock.offcuts.filter((x) => x.id !== og.dataset.offGone); S.saveStock(stock); refresh(); S.undoToast("Offcut marked as gone", snap, refresh); }
    };
  }

  function setStage(s) {
    stage = s;
    tool = "select";
    const order = ["design", "joinery", "shaping", "cutlist", "estimate", "planning"];
    document.querySelectorAll(".stage").forEach((b) => {
      const i = order.indexOf(b.dataset.stage);
      b.classList.toggle("active", b.dataset.stage === s);
      b.classList.toggle("done", i >= 0 && i < order.indexOf(s));
    });
    document.getElementById("cutlist").classList.toggle("show", s === "cutlist");
    if (s === "cutlist") renderCutlist();
    renderTools();
    applyStageTheme();
    renderRight();
  }

  // Joinery, Shaping, Estimate and Planning have their own screens; Design and Cut list stay on this page.
  // Materials are part of Design: the Materials mode (a-materials.html) paints them onto several parts at once.
  const STAGE_PAGES = { joinery: "a-joinery.html", shaping: "a-shaping.html", estimate: "a-estimate.html", planning: "a-planning.html" };
  document.querySelectorAll(".stage").forEach((b) => (b.onclick = () => {
    const page = STAGE_PAGES[b.dataset.stage];
    if (page) location.href = page;
    else {
      history.replaceState(null, "", b.dataset.stage === "cutlist" ? "#cutlist" : location.pathname);
      setStage(b.dataset.stage);
    }
  }));
  const VIEWS = { persp: { azimuth: 62, elevation: 24 }, front: { azimuth: 90, elevation: 0.5 }, side: { azimuth: 0.5, elevation: 0.5 }, top: { azimuth: 90, elevation: 89.5 } };
  document.querySelectorAll("#views button").forEach((b) => (b.onclick = () => {
    document.querySelectorAll("#views button").forEach((x) => x.classList.toggle("on", x === b));
    view.animateTo(VIEWS[b.dataset.v]);
  }));

  hydrateIcons();
  renderParts();
  setStage(location.hash === "#cutlist" ? "cutlist" : "design");
  addEventListener("hashchange", () => setStage(location.hash === "#cutlist" ? "cutlist" : "design"));
</script>
</body>
</html>
